[project]
name = "stardew-tracker"
version = "0.4.0b2"
description = "Local English/Russian progress tracker for Stardew Valley 1.5/1.6 saves: no mods, no dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Stardew Tracker contributors" }]
keywords = ["stardew-valley", "save-game", "tracker", "dashboard"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/KyuuketsukiAkado/stardew-tracker"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
  "RUF001", # кириллица в строках — это локализация, а не опечатка
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
"build_data.py" = ["UP031"]

[tool.mypy]
python_version = "3.9"
files = ["stardew_tracker", "tracker.py", "build_data.py", "packaging/build_app.py", "tools"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "build_data"
ignore_errors = true

[tool.coverage.run]
source = ["stardew_tracker"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
