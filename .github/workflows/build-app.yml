name: Build app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: StardewTracker-windows
            binary: dist/StardewTracker.exe
          - os: macos-latest
            artifact: StardewTracker-macos
            binary: dist/StardewTracker
          - os: ubuntu-22.04
            artifact: StardewTracker-linux
            binary: dist/StardewTracker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установка PyInstaller
        run: python -m pip install -r requirements-build.txt

      - name: Сборка
        shell: bash
        run: python packaging/build_app.py 2>&1 | tee build.log

      - name: "Smoke: версия"
        shell: bash
        run: '"${{ matrix.binary }}" --version'

      - name: "Smoke: тестовый сейв"
        shell: bash
        run: python tests/make_test_save.py build-smoke/saves

      - name: "Smoke: info"
        shell: bash
        run: '"${{ matrix.binary }}" info --saves-dir build-smoke/saves'

      - name: "Smoke: статический отчёт"
        shell: bash
        run: '"${{ matrix.binary }}" build --saves-dir build-smoke/saves --out build-smoke/report.html'

      - name: "Smoke: проверка отчёта"
        shell: bash
        run: |
          test -s build-smoke/report.html
          grep -q "Тестовая" build-smoke/report.html
          grep -q "data:image/png;base64," build-smoke/report.html

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

      - name: Загрузить лог сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-log
          path: build.log
          if-no-files-found: ignore

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "StardewTracker-*"

      - name: Упаковать в zip и посчитать контрольные суммы
        run: |
          mkdir -p dist-release
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            # каталоги с логами сборки (*-log) в релиз не попадают
            case "$name" in *-log) continue ;; esac
            archive="$GITHUB_WORKSPACE/dist-release/${name}-${GITHUB_REF_NAME}.zip"
            if [ -f "$dir/StardewTracker.exe" ]; then
              (cd "$dir" && zip "$archive" StardewTracker.exe)
            else
              chmod +x "$dir/StardewTracker"
              (cd "$dir" && zip "$archive" StardewTracker)
            fi
          done
          cd dist-release
          sha256sum -- *.zip > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Теги с дефисом (v0.4.0-beta.1, v1.0.0-rc.1) публикуются как предварительные.
          flags=()
          case "${GITHUB_REF_NAME}" in *-*) flags+=(--prerelease) ;; esac
          # Заметки берём из .github/release-notes/<тег>.md, иначе — автоматические.
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then flags+=(--notes-file "$notes"); else flags+=(--generate-notes); fi
          gh release create "${GITHUB_REF_NAME}" dist-release/* \
            --title "Stardew Tracker ${GITHUB_REF_NAME#v}" --verify-tag "${flags[@]}"
