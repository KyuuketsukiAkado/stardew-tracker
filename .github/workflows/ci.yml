name: CI

on:
  push:
    branches: [main, master, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 больше не собирается для ubuntu-latest (24.04),
          # поэтому минимальную версию проверяем на 22.04.
          - python: "3.9"
            os: ubuntu-22.04
          - python: "3.11"
            os: ubuntu-24.04
          - python: "3.13"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Юнит-тесты
        run: python -m unittest discover -s tests -v

      - name: Smoke-тест CLI на синтетическом сейве
        run: |
          python tests/make_test_save.py /tmp/saves
          python tracker.py info --saves-dir /tmp/saves
          python tracker.py build --saves-dir /tmp/saves --out /tmp/report.html
          python -m stardew_tracker --version
          test -s /tmp/report.html
          grep -q "Тестовая" /tmp/report.html
          grep -q "data:image/png;base64," /tmp/report.html
          grep -q "Сегодня" /tmp/report.html
          grep -q 'window.__MODE__ = "static";' /tmp/report.html

      - name: Проверка, что data/ не пустая и валидна
        run: |
          python - <<'EOF'
          import json, pathlib
          d = pathlib.Path("data")
          for f in sorted(d.glob("*.json")):
              obj = json.loads(f.read_text(encoding="utf-8"))
              print(f"{f.name:16s} ok  ({len(obj)} ключей)")
          items = json.loads((d / "items.json").read_text(encoding="utf-8"))
          assert len(items) > 700
          fish = json.loads((d / "fish.json").read_text(encoding="utf-8"))
          # 72 вида коллекции 1.6 + 5 «легендарных II» (extended, не в коллекции)
          extended = [k for k, v in fish.items() if v.get("extended")]
          assert len(extended) == 5, len(extended)
          assert len(fish) - len(extended) == 72, len(fish) - len(extended)
          print("OK")
          EOF

  quality:
    name: Линтеры, типы, безопасность, покрытие
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установка инструментов
        run: pip install -r requirements-dev.txt

      - name: py_compile
        run: python -m py_compile tracker.py build_data.py stardew_tracker/*.py tests/*.py packaging/build_app.py

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (форматирование)
        run: ruff format --check stardew_tracker tracker.py tests packaging/build_app.py tools

      - name: mypy
        run: mypy

      - name: Минимальная версия Python 3.9
        run: vermin --no-tips --violations -t=3.9- stardew_tracker tracker.py packaging/build_app.py

      - name: Bandit
        run: bandit -q -r stardew_tracker tracker.py build_data.py tools

      # Демо docs/index.html — сгенерированный файл: после правок dashboard.html или data/
      # его нужно пересобрать (`python tools/build_demo.py`), иначе публичная демонстрация отстаёт.
      - name: Демо docs/index.html актуально
        run: python tools/build_demo.py --check

      - name: Тесты с покрытием
        run: |
          coverage run -m unittest discover -s tests
          coverage report
          coverage xml

      - name: Загрузить покрытие
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
