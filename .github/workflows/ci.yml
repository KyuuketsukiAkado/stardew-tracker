name: CI

on:
  push:
    branches: [main, master, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Юнит-тесты
        run: python -m unittest discover -s tests -v

      - name: Smoke-тест CLI на синтетическом сейве
        run: |
          python tests/make_test_save.py /tmp/saves
          python tracker.py info --saves-dir /tmp/saves
          python tracker.py build --saves-dir /tmp/saves --out /tmp/report.html
          python -m stardew_tracker --version
          test -s /tmp/report.html
          grep -q "Тестовая" /tmp/report.html
          grep -q "data:image/png;base64," /tmp/report.html
          grep -q "Сегодня" /tmp/report.html
          grep -q 'window.__MODE__ = "static";' /tmp/report.html

      - name: Проверка, что data/ не пустая и валидна
        run: |
          python - <<'EOF'
          import json, pathlib
          d = pathlib.Path("data")
          for f in sorted(d.glob("*.json")):
              obj = json.loads(f.read_text(encoding="utf-8"))
              print(f"{f.name:16s} ok  ({len(obj)} ключей)")
          items = json.loads((d / "items.json").read_text(encoding="utf-8"))
          assert len(items) > 700
          fish = json.loads((d / "fish.json").read_text(encoding="utf-8"))
          assert len(fish) == 74
          print("OK")
          EOF

  quality:
    name: Линтеры, типы, безопасность, покрытие
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установка инструментов
        run: pip install -r requirements-dev.txt

      - name: py_compile
        run: python -m py_compile tracker.py build_data.py stardew_tracker/*.py tests/*.py

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (форматирование)
        run: ruff format --check stardew_tracker tracker.py tests

      - name: mypy
        run: mypy

      - name: Минимальная версия Python 3.9
        run: vermin --no-tips --violations -t=3.9- stardew_tracker tracker.py

      - name: Bandit
        run: bandit -q -r stardew_tracker tracker.py build_data.py

      - name: Тесты с покрытием
        run: |
          coverage run -m unittest discover -s tests
          coverage report
          coverage xml

      - name: Загрузить покрытие
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
