<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Stardew Трекер — прогресс фермы</title>
    <style>
      /* ===== Тема: все цвета — только через переменные ===== */
      :root {
        color-scheme: light;
        --bg: #f7f2e6;
        --bg-top: #e3f0fa;
        --surface: #fffdf8;
        --surface-2: #f5eedd;
        --surface-3: #ece2ca;
        --side-bg: #fbf6ea;
        --header-bg: #fffdf8e6;
        --line: #e4d8bf;
        --line-strong: #cbb995;
        --text: #3a3125;
        --muted: #6d6150;
        --faint: #94886f;
        --accent: #4f9b3d;
        --accent-strong: #3a7f2a;
        --accent-soft: #e4f2d9;
        --on-accent: #ffffff;
        --green: #3f8f2f;
        --gold: #b97d0c;
        --red: #c2493a;
        --blue: #2f7cbf;
        --purple: #7a55c7;
        --state-done: #3f8f2f;
        --state-progress: #b97d0c;
        --state-action: #c2493a;
        --state-idle: #8a7f6c;
        --state-info: #2f7cbf;
        --state-lock: #7a55c7;
        --done-soft: #e5f3dc;
        --done-line: #a9d397;
        --progress-soft: #fcf0d2;
        --progress-line: #ecc66f;
        --action-soft: #fde6e0;
        --action-line: #eba596;
        --idle-soft: #f1ece1;
        --idle-line: #d8cdb7;
        --info-soft: #e3effa;
        --info-line: #9fc5e8;
        --lock-soft: #efe8fc;
        --lock-line: #c4b1ee;
        --danger: #b3261e;
        --danger-soft: #fff1ec;
        --danger-line: #f0a493;
        --track: #ebe3d1;
        --tip-bg: #fffdf8;
        --overlay: #2a22184d;
        --shadow: 0 1px 2px #5a40140d, 0 6px 18px #5a401414;
        --shadow-hover: 0 2px 4px #5a401414, 0 10px 26px #5a40141f;
        --radius: 14px;
        --spr-obj0: url("/assets/sprites/objects.png");
        --spr-obj1: url("/assets/sprites/objects2.png");
        --spr-bc: url("/assets/sprites/craftables.png");
        --spr-bundles: url("/assets/sprites/bundles.png");
        --spr-npcs: url("/assets/sprites/npcs.png");
        --spr-monsters: url("/assets/sprites/monsters.png");
        --spr-ui: url("/assets/sprites/ui.png");
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #161a2b;
        --bg-top: #232a4a;
        --surface: #1f2438;
        --surface-2: #272d45;
        --surface-3: #30375a;
        --side-bg: #1a1f33;
        --header-bg: #161a2be6;
        --line: #353d5c;
        --line-strong: #4b5580;
        --text: #eef0f8;
        --muted: #b0b6cf;
        --faint: #858ca8;
        --accent: #7bcb68;
        --accent-strong: #95dc84;
        --accent-soft: #263f2c;
        --on-accent: #10200c;
        --green: #8fd67c;
        --gold: #f2c45c;
        --red: #f08c7c;
        --blue: #84bdf2;
        --purple: #b9a1f7;
        --state-done: #8fd67c;
        --state-progress: #f2c45c;
        --state-action: #f08c7c;
        --state-idle: #a2a8c0;
        --state-info: #84bdf2;
        --state-lock: #b9a1f7;
        --done-soft: #233a2a;
        --done-line: #3f6b45;
        --progress-soft: #3a3322;
        --progress-line: #7a6430;
        --action-soft: #432a2c;
        --action-line: #8a4a45;
        --idle-soft: #2a2f45;
        --idle-line: #474f6e;
        --info-soft: #22344c;
        --info-line: #3f6593;
        --lock-soft: #2f2a4c;
        --lock-line: #5f4f99;
        --danger: #ff8a7a;
        --danger-soft: #3d2228;
        --danger-line: #8f4048;
        --track: #30375a;
        --tip-bg: #1b2034;
        --overlay: #05070fb3;
        --shadow: 0 1px 2px #0005, 0 8px 22px #0006;
        --shadow-hover: 0 2px 6px #0006, 0 12px 28px #0008;
      }
      /*__INLINE_SPRITES__*/
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: linear-gradient(180deg, var(--bg-top) 0, var(--bg) 360px) fixed;
        background-color: var(--bg);
        color: var(--text);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      body.modal-open {
        overflow: hidden;
      }
      .icon-sprite {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        padding: 7px 12px;
        cursor: pointer;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
        font-weight: 650;
      }
      button.active:hover:not(:disabled) {
        background: var(--accent-strong);
      }
      input,
      select {
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        padding: 7px 10px;
        min-width: 0;
      }
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      button:focus-visible,
      a:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 2px;
      }
      :focus:not(:focus-visible) {
        outline: none;
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }
      .shell {
        min-height: 100vh;
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 236px;
        padding: 18px 12px;
        background: var(--side-bg);
        border-right: 1px solid var(--line);
        z-index: 5;
        display: flex;
        flex-direction: column;
      }
      .brand {
        font-size: 17px;
        font-weight: 850;
        letter-spacing: 0.2px;
        padding: 4px 8px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-mark {
        width: 36px;
        height: 36px;
        flex: none;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.13));
      }
      .nav {
        display: grid;
        flex: 1;
        min-height: 0;
        gap: 14px;
        overflow: auto;
        align-content: start;
      }
      .nav-group {
        display: grid;
        gap: 2px;
      }
      .nav-group-title {
        padding: 2px 10px 4px;
        color: var(--faint);
        font-size: 10.5px;
        font-weight: 750;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      .nav a {
        min-width: 0;
        padding: 6px 9px;
        border-radius: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .nav a:hover {
        background: var(--surface-2);
        color: var(--text);
      }
      .nav a.selected {
        background: var(--accent-soft);
        color: var(--text);
        font-weight: 650;
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .nav-icon {
        width: 28px;
        height: 28px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--accent);
      }
      .nav-icon svg {
        width: 16px;
        height: 16px;
        stroke-width: 1.9;
      }
      .nav a.danger-link .nav-icon {
        color: var(--danger);
        border-color: var(--danger-line);
        background: var(--danger-soft);
      }
      .nav-label {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .nav small {
        margin-left: auto;
        color: var(--faint);
        font-size: 10.5px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .mobile-nav {
        display: none;
        width: 100%;
      }
      .sidefoot {
        margin-top: auto;
        color: var(--faint);
        font-size: 11.5px;
        padding: 10px 8px;
        line-height: 1.65;
      }
      .main {
        margin-left: 236px;
        min-height: 100vh;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 11px 26px;
        background: var(--header-bg);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
      }
      .farm {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .farm b {
        font-size: 16px;
      }
      .farm div {
        color: var(--muted);
        font-size: 12.5px;
      }
      .header-tools,
      .toolbar,
      .actions {
        display: flex;
        gap: 7px;
        align-items: center;
        flex-wrap: wrap;
      }
      .pill,
      .badge {
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        background: var(--surface);
        padding: 3px 9px;
        font-size: 11.5px;
        white-space: nowrap;
      }
      .pill b {
        color: var(--text);
      }
      .import-button {
        background: transparent;
      }
      .theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .theme-toggle svg {
        width: 16px;
        height: 16px;
      }
      .content {
        max-width: 1500px;
        padding: 24px 26px 40px;
        margin: auto;
      }
      .title-row {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .title-row h1 {
        font-size: 26px;
        margin: 0 0 2px;
        letter-spacing: -0.2px;
      }
      .sub {
        color: var(--muted);
        font-size: 12.5px;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .stats {
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        margin: 15px 0;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 15px;
        box-shadow: var(--shadow);
      }
      .stat {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 100px;
      }
      .stat[data-go] {
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .stat[data-go]:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
      }
      .stat[data-go]:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
      .stat-label {
        font-size: 11.5px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.6px;
        font-weight: 650;
      }
      .stat-number {
        font-size: 25px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .stat-number small {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
      }
      .stat-sub {
        font-size: 11.5px;
        color: var(--faint);
      }
      .ring {
        width: 50px;
        height: 50px;
        flex: none;
      }
      .ring text {
        fill: var(--text);
        font-weight: 750;
        font-size: 11px;
      }
      .ring-track {
        stroke: var(--track);
      }
      .ring-value {
        stroke: var(--state-progress);
      }
      .ring-value.full {
        stroke: var(--state-done);
      }
      .today-layout {
        display: grid;
        gap: 16px;
        min-width: 0;
      }
      .today-pair {
        align-items: start;
      }
      .today-card {
        min-width: 0;
      }
      .today-card > .section-head:first-child {
        margin-top: 0;
      }
      .today-list,
      .today-list .rows {
        min-width: 0;
      }
      .today-list .row {
        grid-template-columns: 34px minmax(0, 1fr);
      }
      .today-list .row-main {
        grid-column: 2;
      }
      .today-list .row > .right {
        grid-column: 2;
        min-width: 0;
        max-width: 100%;
        justify-content: flex-start;
      }
      .today-list .status-badge {
        max-width: 100%;
      }
      .perfection-summary {
        display: flex;
        align-items: center;
        gap: 17px;
        margin-bottom: 14px;
      }
      .perfection-copy {
        flex: 1;
        min-width: 0;
      }
      .two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .feature-nav {
        margin: 8px 0 22px;
      }
      .feature-grid {
        grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
      }
      .overview-panels {
        gap: 18px;
        margin: 16px 0 20px;
        align-items: stretch;
      }
      .overview-items {
        display: grid;
        gap: 8px;
        min-width: 0;
      }
      .feature-card {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        align-items: start;
        gap: 12px;
        min-width: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 15px;
        box-shadow: var(--shadow);
      }
      .feature-icon {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: var(--accent-soft);
        color: var(--accent-strong);
      }
      .feature-icon svg {
        width: 22px;
        height: 22px;
        stroke-width: 1.8;
      }
      .feature-card h3 {
        margin: 1px 0 5px;
        font-size: 15px;
      }
      .feature-card p {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 12.5px;
      }
      .feature-links {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .feature-links a {
        padding: 4px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--text);
        font-size: 12px;
      }
      .feature-links a:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin: 22px 0 11px;
      }
      .section-head h2 {
        font-size: 18px;
        margin: 0;
      }
      .color-legend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px 14px;
        margin: 0 0 15px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
      }
      .color-legend-title {
        color: var(--muted);
        font-size: 11.5px;
        font-weight: 750;
      }
      .color-key {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        font-size: 11.5px;
      }
      .color-dot {
        width: 19px;
        height: 19px;
        display: inline-grid;
        place-items: center;
        flex: none;
        border: 1px solid currentColor;
        border-radius: 50%;
        font-size: 10px;
        font-weight: 850;
        font-style: normal;
      }
      .color-dot.done {
        color: var(--state-done);
        background: var(--done-soft);
      }
      .color-dot.progress {
        color: var(--state-progress);
        background: var(--progress-soft);
      }
      .color-dot.action {
        color: var(--state-action);
        background: var(--action-soft);
      }
      .color-dot.idle {
        color: var(--state-idle);
        background: var(--idle-soft);
      }
      .color-dot.info {
        color: var(--state-info);
        background: var(--info-soft);
      }
      .color-dot.lock {
        color: var(--state-lock);
        background: var(--lock-soft);
      }
      .welcome-row {
        align-items: center;
        margin-bottom: 16px;
        padding: 16px 19px;
        border: 1px solid var(--done-line);
        border-radius: 16px;
        background: linear-gradient(115deg, var(--accent-soft), var(--surface) 62%, var(--info-soft));
        box-shadow: var(--shadow);
      }
      .welcome-row > div:first-child {
        min-width: 0;
      }
      .welcome-eyebrow {
        margin: 0 0 3px;
        color: var(--accent-strong);
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.9px;
        text-transform: uppercase;
      }
      .welcome-row h1 {
        margin: 0;
        font-size: clamp(22px, 2.4vw, 30px);
        overflow-wrap: anywhere;
      }
      .welcome-ornament {
        width: 44px;
        height: 44px;
        flex: none;
        color: var(--gold);
      }
      .welcome-ornament svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .panel-title {
        font-size: 15px;
        font-weight: 750;
        margin: 0 0 10px;
      }
      .rows {
        display: grid;
        gap: 7px;
      }
      .row {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 11px;
        min-width: 0;
      }
      .right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 5px;
        min-width: 0;
        max-width: 100%;
      }
      .status-badge {
        max-width: 190px;
        white-space: normal;
        overflow-wrap: anywhere;
        text-align: left;
        line-height: 1.25;
      }
      .row.done {
        background: var(--done-soft);
        border-color: var(--done-line);
        border-inline-start: 4px solid var(--state-done);
      }
      .row.alert,
      .grid-item.alert {
        border-color: var(--action-line);
        background: var(--action-soft);
      }
      .row.alert {
        border-inline-start: 4px solid var(--state-action);
      }
      .row.locked,
      .grid-item.locked {
        border-style: dashed;
        border-color: var(--lock-line);
        background: repeating-linear-gradient(135deg, var(--surface), var(--surface) 10px, var(--lock-soft) 10px, var(--lock-soft) 20px);
      }
      .row.locked {
        border-inline-start: 4px solid var(--state-lock);
      }
      .row.locked .item-icon,
      .grid-item.locked .item-icon {
        filter: grayscale(0.7);
        opacity: 0.75;
      }
      .stat.complete {
        border-top: 4px solid var(--state-done);
      }
      .stat.progressing {
        border-top: 4px solid var(--state-progress);
      }
      .stat.not-started {
        border-top: 4px solid var(--state-idle);
      }
      .row-main {
        min-width: 0;
      }
      .name {
        font-weight: 650;
        overflow-wrap: anywhere;
      }
      .en {
        color: var(--faint);
        font-size: 11.5px;
        font-weight: 400;
      }
      .meta {
        display: flex;
        gap: 5px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 4px;
        color: var(--muted);
        font-size: 11.5px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--muted);
        border-radius: 7px;
        padding: 1px 7px;
        font-size: 11px;
      }
      .chip.good {
        background: var(--done-soft);
        border-color: var(--done-line);
        color: var(--state-done);
      }
      .chip.warn {
        background: var(--progress-soft);
        border-color: var(--progress-line);
        color: var(--state-progress);
      }
      .chip.bad {
        background: var(--action-soft);
        border-color: var(--action-line);
        color: var(--state-action);
      }
      .chip.blue {
        background: var(--info-soft);
        border-color: var(--info-line);
        color: var(--state-info);
      }
      .chip.lock {
        background: var(--lock-soft);
        border-color: var(--lock-line);
        color: var(--state-lock);
        font-weight: 650;
      }
      .item-icon,
      .portrait,
      .monster-icon,
      .bundle-icon {
        display: inline-block;
        image-rendering: pixelated;
        background-repeat: no-repeat;
        vertical-align: middle;
        flex: none;
      }
      .item-icon {
        width: 32px;
        height: 32px;
        background-size: 768px 1248px;
      }
      .item-icon.sheet1 {
        background-size: 256px 640px;
      }
      .item-icon.sheet2 {
        width: 32px;
        height: 64px;
        background-size: 256px 2944px;
      }
      .item-icon.small {
        width: 28px;
        height: 28px;
        background-size: 672px 1092px;
      }
      .item-icon.small.sheet1 {
        background-size: 224px 560px;
      }
      .item-icon.small.sheet2 {
        width: 28px;
        height: 56px;
        background-size: 224px 2576px;
      }
      .row > .item-icon,
      .row > .portrait,
      .row > .monster-icon,
      .row > .bundle-icon,
      .row > .ui-icon {
        align-self: center;
        justify-self: center;
      }
      .portrait.compact {
        width: 32px;
        height: 32px;
        background-size: 192px 192px;
      }
      .portrait {
        width: 48px;
        height: 48px;
        background-size: 288px 288px;
        border-radius: 8px;
      }
      .monster-icon {
        width: 32px;
        height: 32px;
        background-size: 192px 64px;
      }
      .bundle-icon {
        width: 32px;
        height: 32px;
        background-size: 640px 96px;
      }
      .ui-icon {
        display: inline-block;
        width: 16px;
        height: 16px;
        background: var(--spr-ui) no-repeat;
        image-rendering: pixelated;
        background-size: 256px 32px;
        vertical-align: middle;
        flex: none;
      }
      .heart-icon {
        width: 20px;
        height: 20px;
        background-size: 320px 40px;
      }
      .bar {
        height: 8px;
        border-radius: 10px;
        background: var(--track);
        overflow: hidden;
        margin-top: 8px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--state-idle);
        border-radius: inherit;
      }
      .bar.done i {
        background: linear-gradient(90deg, var(--accent), var(--state-done));
      }
      .bar.progress i {
        background: linear-gradient(90deg, var(--progress-line), var(--state-progress));
      }
      .bar.action i {
        background: var(--state-action);
      }
      .bar.info i {
        background: var(--state-info);
      }
      .badge.ok {
        color: var(--state-done);
        background: var(--done-soft);
        border-color: var(--done-line);
      }
      .badge.warn {
        color: var(--state-progress);
        background: var(--progress-soft);
        border-color: var(--progress-line);
      }
      .badge.no {
        color: var(--state-idle);
        background: var(--idle-soft);
        border-color: var(--idle-line);
      }
      .badge.alert {
        color: var(--state-action);
        background: var(--action-soft);
        border-color: var(--action-line);
      }
      .badge.lock {
        color: var(--state-lock);
        background: var(--lock-soft);
        border-color: var(--lock-line);
      }
      .empty {
        border: 1px dashed var(--line-strong);
        border-radius: 12px;
        padding: 20px;
        color: var(--faint);
        text-align: center;
        background: var(--surface);
      }
      .bundles {
        grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      }
      .bundle {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 13px;
        box-shadow: var(--shadow);
      }
      .bundle.complete {
        border-color: var(--done-line);
        background: var(--done-soft);
      }
      .bundle-head {
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      .bundle-title {
        flex: 1;
        min-width: 0;
      }
      .today-bundle-link {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 8px;
        min-width: 0;
        color: inherit;
      }
      .today-bundle-link:hover b {
        color: var(--accent-strong);
      }
      .today-bundle-name {
        display: grid;
        min-width: 0;
      }
      .today-bundle-name b {
        overflow-wrap: anywhere;
      }
      .overview-bundle-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 5px;
      }
      .overview-bundle-head b {
        min-width: 0;
        flex: 1;
        overflow-wrap: anywhere;
      }
      .overview-bundle-card {
        position: relative;
        min-width: 0;
        transition: border-color 0.15s ease;
      }
      .overview-bundle-card:hover {
        border-color: var(--accent);
      }
      .overview-bundle-link {
        display: block;
        min-width: 0;
        padding-right: 27px;
        color: inherit;
      }
      .overview-bundle-link:hover .overview-bundle-head b {
        color: var(--accent-strong);
      }
      .overview-bundle-link:focus-visible {
        outline-offset: 4px;
      }
      .overview-bundle-icon {
        display: inline-flex;
        flex: none;
      }
      .bundle-open-hint {
        display: inline-block;
        margin-top: 8px;
        color: var(--blue);
        font-size: 12px;
      }
      .overview-bundle-card > .bundle-tooltip {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 3;
      }
      .bundle-room {
        min-width: 0;
        margin-bottom: 22px;
        scroll-margin-top: 90px;
      }
      .bundle-room:focus-visible,
      .bundle[id]:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 4px;
      }
      .bundle-tooltip .tip-pop {
        width: min(300px, calc(100vw - 36px));
        max-height: min(330px, 70vh);
        overflow-y: auto;
      }
      .museum-source-tip .tip-pop {
        width: min(340px, calc(100vw - 36px));
        max-height: min(360px, 70vh);
        overflow-y: auto;
      }
      .museum-source-preview {
        min-width: 0;
        margin: 3px 0 4px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }
      .museum-source-preview b {
        display: inline;
        margin: 0;
        color: var(--blue);
        font-weight: 700;
      }
      .museum-source-more {
        white-space: nowrap;
        color: var(--faint);
        font-weight: 700;
      }
      .grid-item .museum-source-preview {
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }
      .bundle-tip-link {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: var(--blue);
        text-decoration: none;
      }
      .bundle-tip-link:hover {
        color: var(--accent-strong);
      }
      .bundle-tip-link b {
        flex: none;
      }
      .bundle-items {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 10px;
      }
      .bundle-item {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        max-width: 100%;
        gap: 3px;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 3px 6px;
        font-size: 11px;
        color: var(--muted);
        background: var(--surface-2);
      }
      .bundle-item .name {
        flex: 1 1 88px;
        min-width: 0;
      }
      .bundle-item.have {
        background: var(--done-soft);
        border-color: var(--done-line);
        color: var(--state-done);
      }
      .bundle-room .bundle-items {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        align-items: stretch;
        gap: 7px;
      }
      .bundle-room .bundle-item {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        grid-template-rows: minmax(30px, auto) 26px;
        align-items: center;
        align-content: stretch;
        width: 100%;
        min-height: 72px;
        gap: 4px 5px;
        padding: 5px 6px;
      }
      .bundle-room .bundle-item > .item-icon {
        grid-row: 1;
        grid-column: 1;
        justify-self: center;
      }
      .bundle-room .bundle-item > .name {
        grid-row: 1;
        grid-column: 2;
        align-self: center;
        flex: none;
        overflow-wrap: anywhere;
      }
      .bundle-room .bundle-item > .acq-tip {
        grid-row: 2;
        grid-column: 1;
      }
      .bundle-room .bundle-item > .annotation-actions {
        grid-row: 2;
        grid-column: 2;
        justify-self: end;
      }
      .bundle-room .bundle-item > .note-preview {
        grid-column: 1 / -1;
      }
      .reward-card {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 48px;
        margin-top: 12px;
        padding: 7px 10px;
        border: 1px solid var(--progress-line);
        border-left: 4px solid var(--gold);
        border-radius: 10px;
        background: linear-gradient(105deg, var(--progress-soft), var(--surface));
        color: var(--text);
        font-size: 12.5px;
      }
      .reward-card-label {
        flex: none;
        padding: 3px 7px;
        border-radius: 6px;
        background: var(--gold);
        color: var(--surface);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.35px;
        text-transform: uppercase;
      }
      .reward-card-icon {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        flex: none;
        overflow: hidden;
      }
      .reward-card-icon .item-icon {
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.2));
      }
      .reward-card-icon .item-icon.sheet2 {
        position: relative;
        top: -5px;
        transform: scale(0.56);
      }
      .reward-card-name {
        min-width: 0;
        color: var(--text);
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .quality {
        color: var(--gold);
      }
      .tabs {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        margin: 0 0 14px;
      }
      .tabs button {
        padding: 7px 13px;
      }
      .actions input[type="search"] {
        width: min(260px, 60vw);
      }
      /* ===== Панель фильтров ===== */
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 10px 12px;
        margin: 0 0 14px;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .filter-bar-title {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        align-self: center;
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
      }
      .filter-bar-title svg {
        width: 15px;
        height: 15px;
      }
      .filter {
        display: grid;
        gap: 3px;
        min-width: 0;
      }
      .filter > span {
        color: var(--faint);
        font-size: 11px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .filter select {
        min-width: 150px;
        max-width: 100%;
      }
      .filter-count {
        margin-left: auto;
        align-self: center;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .filter-reset {
        align-self: end;
      }
      .icon-grid {
        grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
      }
      .grid-item {
        min-width: 0;
        min-height: 112px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 7px;
        position: relative;
        box-shadow: var(--shadow);
      }
      .grid-item.done {
        background: var(--done-soft);
        border-color: var(--done-line);
      }
      .grid-item .item-icon {
        margin: 0 auto 4px;
      }
      .grid-item .name {
        font-size: 12px;
        display: block;
      }
      .grid-item .badge {
        position: absolute;
        top: 5px;
        right: 5px;
      }
      .item-footer {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 5px;
      }
      .people {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }
      .person {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        gap: 8px 10px;
        align-items: start;
      }
      .person-content {
        min-width: 0;
      }
      .person-hearts {
        grid-column: 1 / -1;
        display: flex;
        justify-content: center;
        min-width: 0;
      }
      .hearts {
        display: inline-flex;
        align-items: center;
        gap: 1px;
        vertical-align: middle;
        line-height: 1;
      }
      /* ===== Ключи и доступы ===== */
      .unlock-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 8px;
      }
      .unlock-item {
        display: grid;
        grid-template-columns: 26px minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
      }
      .unlock-item.met {
        background: var(--done-soft);
        border-color: var(--done-line);
      }
      .unlock-item.locked {
        border-style: dashed;
        border-color: var(--lock-line);
        background: var(--lock-soft);
      }
      .unlock-mark {
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        font-weight: 850;
        font-size: 12px;
        color: var(--state-idle);
        background: var(--idle-soft);
      }
      .unlock-item.met .unlock-mark {
        color: var(--on-accent);
        background: var(--state-done);
      }
      .unlock-item.locked .unlock-mark {
        color: var(--state-lock);
        background: var(--surface);
      }
      .unlock-mark svg {
        width: 13px;
        height: 13px;
      }
      .unlock-item small {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }
      .req-note {
        display: block;
        margin-top: 5px;
        padding: 6px 9px;
        border: 1px solid var(--lock-line);
        border-radius: 9px;
        background: var(--lock-soft);
        color: var(--text);
        font-size: 12px;
      }
      .req-note b {
        color: var(--state-lock);
      }
      .tip-req {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px dashed var(--lock-line);
      }
      .tip-req strong {
        color: var(--state-lock);
      }
      .goal {
        margin: 8px 0;
      }
      .goal-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .goal-head b,
      .person-content > b {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .goal-head .badge {
        flex: none;
      }
      .form {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 9px 0;
      }
      .form input[type="text"] {
        flex: 1 1 180px;
      }
      .task {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px;
        border-bottom: 1px solid var(--line);
      }
      .task.done {
        background: var(--done-soft);
        border-bottom-color: var(--done-line);
      }
      .task input {
        accent-color: var(--accent);
      }
      .task.done span {
        text-decoration: line-through;
        color: var(--state-done);
      }
      .toast {
        position: fixed;
        bottom: max(20px, env(safe-area-inset-bottom));
        left: 50%;
        width: max-content;
        max-width: calc(100vw - 32px);
        transform: translateX(-50%);
        overflow-wrap: anywhere;
        text-align: center;
        background: var(--text);
        color: var(--surface);
        padding: 10px 16px;
        border-radius: 12px;
        box-shadow: var(--shadow-hover);
        opacity: 0;
        transition: 0.2s;
        z-index: 10;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
      }
      .error {
        border: 1px solid var(--action-line);
        background: var(--action-soft);
        padding: 18px;
        border-radius: var(--radius);
      }
      .error h2 {
        color: var(--state-action);
      }
      .footer-note {
        font-size: 11.5px;
        color: var(--faint);
        margin-top: 16px;
        overflow-wrap: anywhere;
      }
      .hidden {
        display: none !important;
      }
      .annotation-actions {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .annotation-actions button {
        padding: 3px 7px;
        min-width: 30px;
        font-size: 13px;
        color: var(--muted);
      }
      .annotation-actions button.marked {
        color: var(--gold);
        border-color: var(--progress-line);
        background: var(--progress-soft);
      }
      .annotation-actions button.has-note {
        color: var(--blue);
        border-color: var(--info-line);
      }
      .note-preview {
        display: block;
        color: var(--gold);
        font-size: 12px;
        margin-top: 4px;
        overflow-wrap: anywhere;
      }
      .right > .note-preview {
        flex: 1 1 100%;
      }
      .acq-tip {
        position: relative;
        display: inline-block;
      }
      .acq-tip summary {
        cursor: pointer;
        list-style: none;
        width: 26px;
        height: 26px;
        border: 1px solid var(--info-line);
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--info-soft);
        color: var(--state-info);
        font-size: 13px;
        font-weight: 850;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          box-shadow 0.15s ease,
          transform 0.15s ease;
      }
      .acq-tip summary:hover {
        transform: translateY(-1px);
        border-color: var(--blue);
        background: var(--blue);
        color: var(--surface);
        box-shadow: 0 0 0 3px var(--info-soft);
      }
      .acq-tip[open] > summary {
        border-color: var(--blue);
        background: var(--blue);
        color: var(--surface);
      }
      .acq-tip.req-tip summary {
        border-color: var(--lock-line);
        background: var(--lock-soft);
        color: var(--state-lock);
      }
      .acq-tip.req-tip summary:hover,
      .acq-tip.req-tip[open] > summary {
        border-color: var(--state-lock);
        background: var(--state-lock);
        color: var(--surface);
      }
      .museum-source-tip summary {
        display: flex;
        align-items: center;
        gap: 5px;
        width: auto;
        min-width: 28px;
        height: 28px;
        padding: 0 9px;
        border-radius: 9px;
        white-space: nowrap;
        font-size: 11.5px;
      }
      .museum-source-tip summary span {
        font-size: 14px;
        font-weight: 900;
      }
      .acq-tip summary::-webkit-details-marker {
        display: none;
      }
      .tip-pop {
        position: absolute;
        right: 0;
        top: 30px;
        z-index: 8;
        width: min(310px, 78vw);
        padding: 11px 13px;
        background: var(--tip-bg);
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        box-shadow: var(--shadow-hover);
        color: var(--muted);
        font-size: 12px;
        text-align: left;
      }
      .tip-pop b {
        display: block;
        color: var(--text);
        margin-bottom: 4px;
      }
      .tip-line {
        padding: 2px 0;
      }
      .grid-item .annotation-actions {
        justify-content: center;
        margin-top: 5px;
      }
      .bundle-item .annotation-actions button {
        padding: 0 3px;
        min-width: 19px;
        font-size: 10px;
      }
      /* ===== Danger zone: спойлеры ===== */
      .danger-banner {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        gap: 14px;
        align-items: start;
        margin-bottom: 16px;
        padding: 16px 18px;
        border: 2px solid var(--danger-line);
        border-radius: 16px;
        background: repeating-linear-gradient(135deg, var(--danger-soft), var(--danger-soft) 14px, var(--surface) 14px, var(--surface) 28px);
        box-shadow: var(--shadow);
      }
      .danger-banner svg {
        width: 46px;
        height: 46px;
        color: var(--danger);
      }
      .danger-banner h2 {
        margin: 0 0 6px;
        color: var(--danger);
        font-size: 20px;
      }
      .danger-banner ul {
        margin: 6px 0 0;
        padding-left: 18px;
        color: var(--text);
      }
      .danger-gate {
        display: grid;
        gap: 12px;
        max-width: 640px;
      }
      .danger-gate label {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        font-weight: 650;
      }
      .danger-gate input {
        width: 18px;
        height: 18px;
        margin-top: 2px;
        accent-color: var(--danger);
      }
      .danger-gate button.danger,
      button.danger {
        justify-self: start;
        background: var(--danger);
        border-color: var(--danger);
        color: var(--surface);
        font-weight: 700;
      }
      button.danger:disabled {
        cursor: not-allowed;
      }
      .secret-section {
        margin-bottom: 22px;
      }
      .secret-section > .sub {
        margin: -4px 0 10px;
      }
      .spoiler {
        margin: 0 0 8px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .spoiler > summary {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 13px;
        cursor: pointer;
        list-style: none;
        font-weight: 650;
      }
      .spoiler > summary::-webkit-details-marker {
        display: none;
      }
      .spoiler > summary::after {
        content: "▸";
        margin-left: auto;
        color: var(--faint);
      }
      .spoiler[open] > summary::after {
        content: "▾";
      }
      .spoiler-body {
        padding: 0 13px 13px;
        display: grid;
        gap: 8px;
      }
      .spoiler-label {
        flex: none;
        padding: 2px 7px;
        border-radius: 6px;
        background: var(--danger-soft);
        border: 1px solid var(--danger-line);
        color: var(--danger);
        font-size: 10.5px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .spoiler-text {
        position: relative;
        padding: 9px 11px;
        border-radius: 10px;
        background: var(--surface-2);
      }
      .spoiler-text.blurred {
        cursor: pointer;
        user-select: none;
      }
      .spoiler-text.blurred > p {
        filter: blur(6px);
      }
      .spoiler-text.blurred::after {
        content: attr(data-reveal);
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--danger);
        font-weight: 750;
        font-size: 12.5px;
      }
      .spoiler-text p {
        margin: 0;
      }
      .spoiler-text h4 {
        margin: 0 0 4px;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
      }
      /* ===== Визуал к решениям: предметы, схемы, ссылки на вики ===== */
      .spoiler-extra {
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }
      .spoiler-item-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .spoiler-item-list .chip {
        padding: 2px 8px 2px 3px;
        font-size: 12px;
        color: var(--text);
        background: var(--surface);
      }
      .scheme {
        margin: 0;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
      }
      .scheme figcaption {
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 11.5px;
      }
      .scheme-svg {
        display: block;
        width: 100%;
        max-width: 520px;
        height: auto;
      }
      .sc-ground {
        fill: var(--done-soft);
      }
      .sc-water,
      .sc-water-band {
        fill: var(--info-soft);
        stroke: var(--info-line);
      }
      .sc-shore,
      .sc-feature {
        fill: var(--progress-soft);
        stroke: var(--progress-line);
      }
      .sc-building,
      .sc-truck {
        fill: var(--surface-3);
        stroke: var(--line-strong);
        stroke-width: 1.5;
      }
      .sc-roof {
        fill: var(--action-soft);
        stroke: var(--action-line);
        stroke-width: 1.5;
      }
      .sc-path,
      .sc-bridge {
        fill: var(--surface-2);
        stroke: var(--line-strong);
      }
      .sc-bush {
        fill: var(--accent);
        opacity: 0.55;
      }
      .sc-boulder,
      .sc-rock,
      .sc-stone {
        fill: var(--line-strong);
      }
      .sc-wheel {
        fill: var(--text);
      }
      .sc-rail {
        stroke: var(--muted);
        stroke-width: 3;
        fill: none;
      }
      .sc-sleepers {
        stroke: var(--line-strong);
        stroke-width: 4;
      }
      .sc-dune {
        fill: none;
        stroke: var(--progress-line);
        stroke-width: 2;
      }
      .sc-fence {
        fill: none;
        stroke: var(--gold);
        stroke-width: 3;
        stroke-dasharray: 6 4;
      }
      .sc-hidden-zone {
        fill: var(--lock-soft);
        stroke: var(--state-lock);
        stroke-dasharray: 4 3;
      }
      .sc-tile {
        fill: none;
        stroke: var(--danger);
        stroke-width: 2;
        stroke-dasharray: 4 3;
      }
      .sc-target {
        fill: var(--danger);
      }
      .sc-target-ring {
        fill: none;
        stroke: var(--danger);
        stroke-width: 2.5;
      }
      .sc-label {
        fill: var(--text);
        font-size: 11px;
      }
      .sc-strong {
        font-weight: 750;
      }
      .sc-compass {
        fill: var(--muted);
      }
      .sc-shell {
        fill: var(--progress-soft);
        stroke: var(--gold);
        stroke-width: 2;
      }
      .sc-shell-line {
        stroke: var(--gold);
        fill: none;
      }
      .sc-step {
        fill: var(--accent);
      }
      .sc-step-text {
        fill: var(--on-accent);
        font-size: 13px;
        font-weight: 800;
      }
      .sc-block {
        fill: var(--state-lock);
      }
      .sc-arrow {
        stroke: var(--muted);
        stroke-width: 2;
      }
      .sc-arrow-head {
        fill: var(--muted);
      }
      .scheme-route {
        display: grid;
        gap: 6px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .scheme-route li,
      .scheme-row,
      .scheme-color {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-2);
      }
      .scheme-route em {
        color: var(--accent-strong);
        font-style: normal;
        font-weight: 800;
      }
      .scheme-step {
        width: 22px;
        height: 22px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--accent);
        color: var(--on-accent);
        font-size: 12px;
        font-weight: 800;
      }
      .scheme-goal {
        width: 28px;
        text-align: center;
        color: var(--gold);
        font-size: 18px;
      }
      .scheme-rows,
      .scheme-colors {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 6px;
      }
      .scheme-row span,
      .scheme-color span {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
        text-align: right;
      }
      .scheme-color i {
        width: 14px;
        height: 28px;
        flex: none;
        border-radius: 4px;
      }
      .spoiler-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
      }
      .wiki-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border: 1px solid var(--info-line);
        border-radius: 999px;
        background: var(--info-soft);
        color: var(--blue);
        font-size: 12px;
        font-weight: 650;
      }
      .wiki-link:hover {
        background: var(--blue);
        color: var(--surface);
      }
      .note-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: var(--overlay);
        display: grid;
        place-items: center;
        overflow-y: auto;
        padding: max(15px, env(safe-area-inset-top))
          max(15px, env(safe-area-inset-right))
          max(15px, env(safe-area-inset-bottom))
          max(15px, env(safe-area-inset-left));
      }
      .note-dialog {
        width: min(430px, 100%);
        max-height: calc(100vh - 30px);
        max-height: calc(100dvh - 30px);
        overflow-y: auto;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        box-shadow: var(--shadow-hover);
      }
      .note-dialog h2 {
        font-size: 17px;
        margin: 0 0 5px;
      }
      .note-dialog textarea {
        display: block;
        width: 100%;
        min-height: 100px;
        resize: vertical;
        margin: 12px 0;
        background: var(--surface-2);
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        color: var(--text);
        padding: 10px;
        font: inherit;
      }
      .note-dialog .actions {
        justify-content: flex-end;
      }
      @media (max-width: 900px) {
        .sidebar {
          position: sticky;
          top: 0;
          width: 100%;
          height: auto;
          padding: 7px 8px;
          display: block;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .brand {
          padding: 1px 4px 7px;
          font-size: 14px;
        }
        .brand-mark {
          width: 28px;
          height: 28px;
        }
        .nav {
          display: none;
        }
        .mobile-nav {
          display: block;
          min-height: 40px;
          background: var(--surface);
          border-color: var(--line-strong);
        }
        .sidefoot {
          display: none;
        }
        .main {
          margin-left: 0;
        }
        header {
          position: static;
          padding: 10px 13px;
        }
        .content {
          padding: 14px;
        }
        .two,
        .three {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .title-row h1 {
          font-size: 22px;
        }
      }
      @media (max-width: 600px) {
        .content {
          padding: 12px;
        }
        .welcome-row {
          padding: 12px;
        }
        .welcome-ornament {
          width: 34px;
          height: 34px;
        }
        .today-layout {
          gap: 12px;
        }
        .two,
        .three {
          grid-template-columns: 1fr;
        }
        .title-row,
        .section-head {
          align-items: flex-start;
        }
        .actions input[type="search"] {
          flex: 1 1 100%;
          width: 100%;
        }
        .form input[type="text"],
        .form select {
          flex: 1 1 100%;
        }
        .right {
          justify-content: flex-start;
        }
        .filter,
        .filter select {
          flex: 1 1 140px;
          min-width: 0;
          width: 100%;
        }
        .filter-count {
          margin-left: 0;
        }
        .danger-banner {
          grid-template-columns: 1fr;
        }
        .note-dialog {
          max-height: calc(100vh - 24px);
          max-height: calc(100dvh - 24px);
        }
      }
      @media (max-width: 450px) {
        button {
          min-height: 40px;
        }
        .annotation-actions button {
          min-height: 34px;
          min-width: 36px;
        }
        .bundle-item .annotation-actions button {
          min-height: 28px;
          min-width: 24px;
        }
        .nav a {
          min-height: 38px;
          align-items: center;
        }
        .acq-tip summary {
          width: 32px;
          height: 32px;
        }
        .museum-source-tip summary {
          width: auto;
          min-height: 32px;
          height: 32px;
        }
        header {
          align-items: flex-start;
        }
        .farm {
          width: 100%;
        }
        .header-tools {
          width: 100%;
          gap: 5px;
        }
        .header-tools select {
          flex: 1;
          max-width: 100%;
        }
        .pill {
          font-size: 10px;
        }
        .content {
          padding: 11px;
        }
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }
        .stat {
          padding: 10px;
          min-height: 80px;
        }
        .stat-number {
          font-size: 20px;
        }
        .ring {
          width: 39px;
          height: 39px;
        }
        .row {
          grid-template-columns: 32px minmax(0, 1fr);
          gap: 7px;
          padding: 8px;
        }
        .row > .right {
          grid-column: 2;
          justify-content: flex-start;
        }
        .item-icon {
          width: 28px;
          height: 28px;
          background-size: 672px 1092px;
        }
        .item-icon.sheet1 {
          background-size: 224px 560px;
        }
        .item-icon.sheet2 {
          width: 28px;
          height: 56px;
          background-size: 224px 2576px;
        }
        .icon-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .actions {
          width: 100%;
        }
        .actions input[type="search"] {
          flex: 1;
          width: auto;
        }
        .bundles {
          grid-template-columns: 1fr;
        }
        .people {
          grid-template-columns: 1fr;
        }
        .section-head {
          margin-top: 16px;
        }
      }
      @media (max-width: 360px) {
        .content {
          padding: 8px;
        }
        .stats {
          grid-template-columns: 1fr;
        }
        .pill {
          white-space: normal;
        }
        .note-modal {
          padding: 8px;
        }
        .note-dialog {
          padding: 13px;
          max-height: calc(100vh - 16px);
          max-height: calc(100dvh - 16px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

      const TIME_BUCKETS = {

      // Применяет фильтры раздела к строкам (поиск и «готово» — отдельно).
      function applyFilters(rows, type) {
        const seasonKey =
          filters.season === "current" ? S.meta.season : filters.season;
        return rows.filter((r) => {
          if (filters.access === "open" && r.lock === "locked" && !r.done)
            return false;
          if (filters.access === "locked" && (r.done || r.lock === "open"))
            return false;
          if (type === "fish") {
            if (filters.place && !(r.groups || []).includes(filters.place))
              return false;
            if (filters.gear === "rod" && r.trap) return false;
            if (filters.gear === "trap" && !r.trap) return false;
            if (seasonKey && r.seasons?.length && !r.seasons.includes(seasonKey))
              return false;
            if (filters.weather && r.weather && r.weather !== "both" && r.weather !== filters.weather)
              return false;
            if (filters.time && r.time) {
              const w = fishWindows(r.time);
              if (filters.time === "now") {
                const now = gameMinutes(S.meta.clock);
                if (!w.some(([s, e]) => s <= now && now <= e)) return false;
              } else if (TIME_BUCKETS[filters.time]) {
                const [a, b] = TIME_BUCKETS[filters.time];
                if (!overlaps(w, a, b)) return false;

            }
          } else if (type === "museum") {
            if (filters.tag && !(r.tags || []).includes(filters.tag)) return false;

          };
        document.querySelectorAll("details.acq-tip").forEach((tip) => {
          tip.addEventListener("pointerleave", () => {
            tip.open = false;
          });
          tip.addEventListener("focusout", (event) => {
            if (!tip.contains(event.relatedTarget)) tip.open = false;
          });
        });
        [$("#goalTitle"), $("#goalTarget")].forEach((input) => {
          if (input)
            input.onkeydown = (event) => {
              if (event.key === "Enter") {
                event.preventDefault();
                $("#addGoal")?.click();
              }
            };
        });
        const taskTitle = $("#taskTitle");
        if (taskTitle)
          taskTitle.onkeydown = (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              $("#addTask")?.click();
            }
          };
        document.querySelectorAll("[data-mark]").forEach(
          (b) =>
            (b.onclick = () => {
              S.goals = S.goals || { goals: [], tasks: [] };
              S.goals.annotations = S.goals.annotations || {};
              let key = b.dataset.mark,
                a = annotation(key);
              a.marked = !a.marked;
              if (a.marked || a.note) S.goals.annotations[key] = a;
              else delete S.goals.annotations[key];
              persist();
              render();
              focusDataControl("data-mark", key);
            }),
        );
        document
          .querySelectorAll("[data-note]")
          .forEach((b) => (b.onclick = () => openNote(b.dataset.note, b)));
        let modal = $("#noteModal"),
          saveNoteBtn = $("#noteSave"),
          cancelNoteBtn = $("#noteCancel");
        if (saveNoteBtn) saveNoteBtn.onclick = saveNote;
        if (cancelNoteBtn) cancelNoteBtn.onclick = closeNote;
        if (modal)
          modal.onclick = (e) => {
            if (e.target === modal) closeNote();
          };
        document.onkeydown = (e) => {
          const modal = $("#noteModal");
          if (!modal || modal.classList.contains("hidden")) return;
          if (e.key === "Escape") {
            closeNote();
            return;
          }
          if (e.key === "Tab") {
            const focusable = modal.querySelectorAll(
              'button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])',
            );
            if (!focusable.length) {
              e.preventDefault();
              modal.focus();
              return;
            }
            const first = focusable[0],
              last = focusable[focusable.length - 1];
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
        };
        let n = $("#nowOnly");
        if (n)
          n.onclick = () => {
            nowOnly = !nowOnly;
            render();
            $("#nowOnly")?.focus();
          };
        document.querySelectorAll("[data-kind]").forEach(
          (b) =>
            (b.onclick = () => {
              kindFilter = b.dataset.kind === "all" ? "" : b.dataset.kind;
              render();
              focusDataControl("data-kind", b.dataset.kind);
            }),
        );
        let r = $("#retry");
        if (r)
          r.onclick = () =>
            fetch("/api/refresh")
              .then((response) => {
                if (!response.ok) throw new Error("Refresh failed");
                return pull(true);
              })
              .catch(() => toast(t("apiError")));
        let ag = $("#addGoal");
        if (ag)
          ag.onclick = () => {
            let v = $("#goalTitle").value.trim();
            if (!v) {
              $("#goalTitle").focus();
              return;
            }
            const metric = $("#goalMetric").value,
              targetInput = $("#goalTarget"),
              target = targetInput.value.trim()
                ? Number(targetInput.value)
                : S.counts[metric]?.[1] || 1;
            if (!Number.isInteger(target) || target < 1) {
              targetInput.focus();
              targetInput.reportValidity?.();
              return;
            }
            S.goals.goals.push({
              id: Math.random().toString(36).slice(2),
              title: v,
              metric,
              target,
            });
            persist();
            render();
            $("#goalTitle")?.focus();
          };
        let at = $("#addTask");
        if (at)
          at.onclick = () => {
            let v = $("#taskTitle").value.trim();
            if (!v) {
              $("#taskTitle").focus();
              return;
            }
            S.goals.tasks.push({
              id: Math.random().toString(36).slice(2),
              title: v,
              done: false,
            });
            persist();
            render();
            $("#taskTitle")?.focus();
          };
        document.querySelectorAll("[data-delgoal]").forEach(
          (b) =>
            (b.onclick = () => {
              const id = b.dataset.delgoal;
              S.goals.goals = S.goals.goals.filter((x) => x.id !== id);
              persist();
              render();
              const next = [...document.querySelectorAll("[data-delgoal]")][0];
              (next || $("#goalTitle"))?.focus();
            }),
        );
        document.querySelectorAll("[data-deltask]").forEach(
          (b) =>
            (b.onclick = () => {
              const id = b.dataset.deltask;
              S.goals.tasks = S.goals.tasks.filter((x) => x.id !== id);
              persist();
              render();
              const next = [...document.querySelectorAll("[data-deltask]")][0];
              (next || $("#taskTitle"))?.focus();
            }),
        );
        document.querySelectorAll("[data-task]").forEach(
          (c) =>
            (c.onchange = () => {
              const id = c.dataset.task;
              let x = S.goals.tasks.find((a) => a.id === id);
              if (x) x.done = c.checked;
              persist();
              render();
              focusDataControl("data-task", id);
            }),
        );
        let fi = $("#goalsFile"),
          importButton = $("#importGoals");
        if (importButton && fi) importButton.onclick = () => fi.click();
        if (fi)
          fi.onchange = async () => {
            if (!fi.files?.[0]) return;
            try {
              let d = JSON.parse(await fi.files[0].text());
              if (!Array.isArray(d.goals) || !Array.isArray(d.tasks))
                throw Error("Invalid goals JSON");
              S.goals = d;
              if (!(await persist())) {
                $("#importGoals")?.focus();
                return;
              }
              render();
              $("#importGoals")?.focus();
              toast(t("imported"));
            } catch (e) {
              $("#importGoals")?.focus();
              toast(t("invalidFile"));
            } finally {
              fi.value = "";
            }
          };
      }
      function render() {
        document.documentElement.lang = EN ? "en" : "ru";
        document.title = t("appTitle");
        header();
        nav();
        let v = $("#view");
        if (!S) {
          v.innerHTML = errorView();
          bind();
          return;
        }
        v.innerHTML = (views[route] || overview)();
        bind();
      }
      async function pull(force) {
        if (MODE !== "live") return;
        try {
          let r = await fetch("/api/state", { cache: "no-store" });
          if (!r.ok) {
            let e = await r.json();
            ERR = e.error;
            S = null;
            render();
            return;
          }
          let n = await r.json();
          if (pendingSaves > 0 && S) n.goals = S.goals;
          const saveChanged = !S || n.meta.save_mtime !== S.meta.save_mtime;
          if (
            force ||
            saveChanged ||
            JSON.stringify(n.goals) !== JSON.stringify(S.goals)
          ) {
            if (force || saveChanged) savesCache = null;
            // Не перерисовываем страницу, пока пользователь печатает в поиске.
            const typing =
              !force &&
              !saveChanged &&
              document.activeElement?.matches?.("input, textarea, select");
            S = n;
            ERR = null;
            if (!typing) {
              const y = scrollY;
              render();
              window.scrollTo(0, y);
            }
          }
        } catch (e) {
          if (force) toast(t("apiError"));
        }
      }
      window.addEventListener("hashchange", () => {
        const hashParts = location.hash.slice(1).split("/"),
          requested = hashParts.shift();
        route = sections.includes(requested) ? requested : "overview";
        routeTarget = route === "bundles" ? hashParts.join("/") : "";
        search = "";
        peopleSearch = "";
        // Danger zone требует подтверждения при каждом входе.
        if (route !== "secrets") {
          dangerConsent = false;
          revealed.clear();
        }
        render();
        scrollTo(0, 0);
        if (!focusBundleTarget()) focusViewHeading();
      });
      if (!S && MODE === "live") fetch("/api/refresh").then(pull);
      render();
      focusBundleTarget();
      if (MODE === "live") setInterval(pull, 3000);
    </script>
  </body>
</html>
