<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Stardew Трекер — прогресс фермы</title>
    <style>
      :root {
        --bg: #11150f;
        --panel: #1b2118;
        --panel2: #252d21;
        --line: #364130;
        --text: #f1efdf;
        --muted: #a3ad98;
        --faint: #76816e;
        --green: #9bd276;
        --gold: #f0c966;
        --red: #e88779;
        --blue: #83bde2;
        --purple: #c3a5e5;
        --state-done: #9bd276;
        --state-progress: #f0c966;
        --state-action: #e88779;
        --state-idle: #a3ad98;
        --state-info: #83bde2;
        --shadow: 0 8px 28px #0004;
        --spr-obj0: url("/assets/sprites/objects.png");
        --spr-obj1: url("/assets/sprites/objects2.png");
        --spr-bc: url("/assets/sprites/craftables.png");
        --spr-bundles: url("/assets/sprites/bundles.png");
        --spr-npcs: url("/assets/sprites/npcs.png");
        --spr-monsters: url("/assets/sprites/monsters.png");
        --spr-ui: url("/assets/sprites/ui.png");
      }
      /*__INLINE_SPRITES__*/
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: radial-gradient(
          ellipse at 50% -30%,
          #35412b 0,
          #11150f 55%
        );
        color: var(--text);
        font:
          14px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      body.modal-open {
        overflow: hidden;
      }
      .icon-sprite {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel2);
        padding: 8px 11px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--green);
        filter: brightness(1.12);
      }
      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      button.active {
        background: #31432b;
        border-color: #739859;
        color: #e4f2d7;
      }
      input,
      select {
        background: #151a13;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        min-width: 0;
      }
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      button:focus-visible,
      a:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 2px;
      }
      :focus:not(:focus-visible) {
        outline: none;
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }
      .shell {
        min-height: 100vh;
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 226px;
        padding: 18px 12px;
        background: #171c15;
        border-right: 1px solid var(--line);
        z-index: 5;
        display: flex;
        flex-direction: column;
      }
      .brand {
        font-size: 17px;
        font-weight: 850;
        letter-spacing: 0.2px;
        padding: 4px 8px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-mark {
        width: 36px;
        height: 36px;
        flex: none;
        filter: drop-shadow(0 3px 8px #0005);
      }
      .nav {
        display: grid;
        flex: 1;
        min-height: 0;
        gap: 13px;
        overflow: auto;
      }
      .nav-group {
        display: grid;
        gap: 3px;
      }
      .nav-group-title {
        padding: 2px 10px 4px;
        color: var(--faint);
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      .nav a {
        min-width: 0;
        padding: 7px 9px;
        border-radius: 10px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .nav a:hover,
      .nav a.selected {
        background: #2b3626;
        color: #f4f2e4;
      }
      .nav-icon {
        width: 26px;
        height: 26px;
        flex: none;
        display: grid;
        place-items: center;
        border: 1px solid #364130;
        border-radius: 8px;
        background: #222a1f;
        color: var(--green);
      }
      .nav-icon svg {
        width: 15px;
        height: 15px;
        stroke-width: 1.8;
      }
      .nav-label {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .nav small {
        margin-left: auto;
        color: var(--faint);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .mobile-nav {
        display: none;
        width: 100%;
      }
      .sidefoot {
        margin-top: auto;
        color: var(--faint);
        font-size: 11px;
        padding: 10px 8px;
        line-height: 1.65;
      }
      .main {
        margin-left: 226px;
        min-height: 100vh;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px 24px;
        background: #11150fef;
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
      }
      .farm {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .farm b {
        font-size: 16px;
      }
      .farm div {
        color: var(--muted);
        font-size: 12px;
      }
      .header-tools,
      .toolbar,
      .actions {
        display: flex;
        gap: 7px;
        align-items: center;
        flex-wrap: wrap;
      }
      .pill,
      .badge {
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        padding: 4px 9px;
        font-size: 11px;
        white-space: nowrap;
      }
      .pill b {
        color: var(--text);
      }
      .import-button {
        background: transparent;
      }
      .content {
        max-width: 1540px;
        padding: 23px;
        margin: auto;
      }
      .title-row {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .title-row h1 {
        font-size: 25px;
        margin: 0 0 2px;
      }
      .sub {
        color: var(--muted);
        font-size: 12px;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .stats {
        grid-template-columns: repeat(auto-fit, minmax(166px, 1fr));
        margin: 15px 0;
      }
      .card {
        background: linear-gradient(145deg, #20271d, #191f17);
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 14px;
        box-shadow: var(--shadow);
      }
      .stat {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 100px;
      }
      .stat[data-go] {
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          transform 0.15s ease;
      }
      .stat[data-go]:hover {
        border-color: #739859;
        transform: translateY(-1px);
      }
      .stat[data-go]:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 3px;
      }
      .stat-label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }
      .stat-number {
        font-size: 23px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .stat-number small {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
      }
      .stat-sub {
        font-size: 11px;
        color: var(--faint);
      }
      .ring {
        width: 47px;
        height: 47px;
        flex: none;
      }
      .ring text {
        fill: var(--text);
        font-weight: 750;
        font-size: 11px;
      }
      .today-layout {
        display: grid;
        gap: 14px;
        min-width: 0;
      }
      .today-pair {
        align-items: start;
      }
      .today-card {
        min-width: 0;
      }
      .today-card > .section-head:first-child {
        margin-top: 0;
      }
      .today-list,
      .today-list .rows {
        min-width: 0;
      }
      .today-list .row {
        grid-template-columns: 34px minmax(0, 1fr);
      }
      .today-list .row-main {
        grid-column: 2;
      }
      .today-list .row > .right {
        grid-column: 2;
        min-width: 0;
        max-width: 100%;
        justify-content: flex-start;
      }
      .today-list .status-badge {
        max-width: 100%;
      }
      .perfection-summary {
        display: flex;
        align-items: center;
        gap: 17px;
        margin-bottom: 14px;
      }
      .perfection-copy {
        flex: 1;
        min-width: 0;
      }
      .two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .feature-nav {
        margin: 8px 0 22px;
      }
      .feature-grid {
        grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
      }
      .overview-panels {
        gap: 18px;
        margin: 16px 0 20px;
        align-items: stretch;
      }
      .overview-items {
        display: grid;
        gap: 8px;
        min-width: 0;
      }
      .feature-card {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        align-items: start;
        gap: 12px;
        min-width: 0;
        background: linear-gradient(145deg, #20271d, #191f17);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 15px;
        box-shadow: var(--shadow);
      }
      .feature-icon {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 1px solid #596c4c;
        border-radius: 12px;
        background: #293a25;
        color: var(--green);
      }
      .feature-icon svg {
        width: 22px;
        height: 22px;
        stroke-width: 1.7;
      }
      .feature-card h3 {
        margin: 1px 0 5px;
        font-size: 15px;
      }
      .feature-card p {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 12px;
      }
      .feature-links {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .feature-links a {
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #151a13;
        color: var(--text);
        font-size: 11px;
      }
      .feature-links a:hover {
        border-color: var(--green);
        background: #2b3626;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin: 20px 0 11px;
      }
      .section-head h2 {
        font-size: 17px;
        margin: 0;
      }
      .color-legend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px 13px;
        margin: 0 0 15px;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #171c15;
      }
      .color-legend-title {
        color: var(--muted);
        font-size: 11px;
        font-weight: 750;
      }
      .color-key {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        font-size: 11px;
      }
      .color-dot {
        width: 19px;
        height: 19px;
        display: inline-grid;
        place-items: center;
        flex: none;
        border: 1px solid currentColor;
        border-radius: 50%;
        font-size: 10px;
        font-weight: 850;
      }
      .color-dot.done {
        color: var(--state-done);
        background: #273c24;
      }
      .color-dot.progress {
        color: var(--state-progress);
        background: #40351f;
      }
      .color-dot.action {
        color: var(--state-action);
        background: #492a25;
      }
      .color-dot.idle {
        color: var(--state-idle);
        background: #282e27;
      }
      .color-dot.info {
        color: var(--state-info);
        background: #243546;
      }
      .welcome-row {
        align-items: center;
        margin-bottom: 16px;
        padding: 14px 17px;
        border: 1px solid #526a43;
        border-radius: 14px;
        background: linear-gradient(115deg, #202b1d, #1b2118 62%, #26331f);
        box-shadow: var(--shadow);
      }
      .welcome-row > div:first-child {
        min-width: 0;
      }
      .welcome-eyebrow {
        margin: 0 0 3px;
        color: var(--state-done);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.9px;
        text-transform: uppercase;
      }
      .welcome-row h1 {
        margin: 0;
        font-size: clamp(21px, 2.4vw, 29px);
        overflow-wrap: anywhere;
      }
      .welcome-ornament {
        width: 44px;
        height: 44px;
        flex: none;
        color: var(--state-progress);
        opacity: 0.88;
      }
      .welcome-ornament svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .panel-title {
        font-size: 14px;
        font-weight: 750;
        margin: 0 0 9px;
      }
      .rows {
        display: grid;
        gap: 7px;
      }
      .row {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        min-width: 0;
      }
      .right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 5px;
        min-width: 0;
        max-width: 100%;
      }
      .status-badge {
        max-width: 190px;
        white-space: normal;
        overflow-wrap: anywhere;
        text-align: left;
        line-height: 1.25;
      }
      .row.done {
        background: #192019;
        border-inline-start: 3px solid var(--state-done);
      }
      .row.alert,
      .grid-item.alert {
        border-color: #8b493c;
        background: #30211f;
      }
      .row.alert {
        border-inline-start: 3px solid var(--state-action);
      }
      .stat.complete {
        border-top: 3px solid var(--state-done);
      }
      .stat.progressing {
        border-top: 3px solid var(--state-progress);
      }
      .stat.not-started {
        border-top: 3px solid var(--state-idle);
      }
      .row-main {
        min-width: 0;
      }
      .name {
        font-weight: 650;
        overflow-wrap: anywhere;
      }
      .en {
        color: var(--faint);
        font-size: 11px;
      }
      .meta {
        display: flex;
        gap: 5px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
      }
      .chip {
        border: 1px solid #3a4534;
        background: #252d21;
        color: #bdc6b2;
        border-radius: 6px;
        padding: 1px 6px;
        font-size: 10px;
      }
      .chip.good {
        background: #263d26;
        border-color: #476e40;
        color: #d1edbd;
      }
      .chip.warn {
        background: #443721;
        border-color: #8a6636;
        color: #f3d997;
      }
      .chip.bad {
        background: #452b28;
        border-color: #74433c;
        color: #f2b0a6;
      }
      .chip.blue {
        background: #243546;
        border-color: #416581;
        color: #bbdef5;
      }
      .item-icon,
      .portrait,
      .monster-icon,
      .bundle-icon {
        display: inline-block;
        image-rendering: pixelated;
        background-repeat: no-repeat;
        vertical-align: middle;
        flex: none;
      }
      .item-icon {
        width: 32px;
        height: 32px;
        background-size: 768px 1248px;
      }
      .item-icon.sheet1 {
        background-size: 256px 640px;
      }
      .item-icon.sheet2 {
        width: 32px;
        height: 64px;
        background-size: 256px 2944px;
      }
      .item-icon.small {
        width: 28px;
        height: 28px;
        background-size: 672px 1092px;
      }
      .item-icon.small.sheet1 {
        background-size: 224px 560px;
      }
      .item-icon.small.sheet2 {
        width: 28px;
        height: 56px;
        background-size: 224px 2576px;
      }
      .row > .item-icon,
      .row > .portrait,
      .row > .monster-icon,
      .row > .bundle-icon,
      .row > .ui-icon {
        align-self: center;
        justify-self: center;
      }
      .portrait.compact {
        width: 32px;
        height: 32px;
        background-size: 192px 192px;
      }
      .portrait {
        width: 48px;
        height: 48px;
        background-size: 288px 288px;
      }
      .monster-icon {
        width: 32px;
        height: 32px;
        background-size: 192px 64px;
      }
      .bundle-icon {
        width: 32px;
        height: 32px;
        background-size: 640px 96px;
      }
      .ui-icon {
        display: inline-block;
        width: 16px;
        height: 16px;
        background: var(--spr-ui) no-repeat;
        image-rendering: pixelated;
        background-size: 256px 32px;
        vertical-align: middle;
        flex: none;
      }
      .heart-icon {
        width: 20px;
        height: 20px;
        background-size: 320px 40px;
      }
      .bar {
        height: 6px;
        border-radius: 10px;
        background: #30392c;
        overflow: hidden;
        margin-top: 8px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #687364, #9aa48f);
        border-radius: inherit;
      }
      .bar.done i {
        background: linear-gradient(90deg, #72aa51, #b6df83);
      }
      .bar.progress i {
        background: linear-gradient(90deg, #bc8b36, #f2d274);
      }
      .bar.action i {
        background: linear-gradient(90deg, #b9554a, #eb8b77);
      }
      .bar.info i {
        background: linear-gradient(90deg, #4c80a6, #83bde2);
      }
      .badge.ok {
        color: #d5efbd;
        background: #273c24;
        border-color: #486b3c;
      }
      .badge.warn {
        color: #f3d992;
        background: #40351f;
        border-color: #775d2c;
      }
      .badge.no {
        color: #c1c6bb;
        background: #292e28;
        border-color: #4b5547;
      }
      .badge.alert {
        color: #ffb3a5;
        background: #492a25;
        border-color: #8b493c;
      }
      .empty {
        border: 1px dashed var(--line);
        border-radius: 10px;
        padding: 20px;
        color: var(--faint);
        text-align: center;
      }
      .bundles {
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      }
      .bundle {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 12px;
      }
      .bundle.complete {
        border-color: #4c7141;
        background: #1c281b;
      }
      .bundle-head {
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      .bundle-title {
        flex: 1;
        min-width: 0;
      }
      .today-bundle-link {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 8px;
        min-width: 0;
        color: inherit;
      }
      .today-bundle-link:hover b {
        color: var(--green);
      }
      .today-bundle-name {
        display: grid;
        min-width: 0;
      }
      .today-bundle-name b {
        overflow-wrap: anywhere;
      }
      .overview-bundle-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 5px;
      }
      .overview-bundle-head b {
        min-width: 0;
        flex: 1;
        overflow-wrap: anywhere;
      }
      .overview-bundle-card {
        position: relative;
        min-width: 0;
        transition: border-color 0.15s ease;
      }
      .overview-bundle-card:hover {
        border-color: #739859;
      }
      .overview-bundle-link {
        display: block;
        min-width: 0;
        padding-right: 27px;
        color: inherit;
      }
      .overview-bundle-link:hover .overview-bundle-head b {
        color: var(--green);
      }
      .overview-bundle-link:focus-visible {
        outline-offset: 4px;
      }
      .overview-bundle-icon {
        display: inline-flex;
        flex: none;
      }
      .bundle-open-hint {
        display: inline-block;
        margin-top: 8px;
        color: var(--blue);
        font-size: 11px;
      }
      .overview-bundle-card > .bundle-tooltip {
        position: absolute;
        top: 14px;
        right: 14px;
        z-index: 3;
      }
      .bundle-room {
        min-width: 0;
        margin-bottom: 22px;
        scroll-margin-top: 90px;
      }
      .bundle-room:focus-visible,
      .bundle[id]:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 4px;
      }
      .bundle-tooltip .tip-pop {
        width: min(300px, calc(100vw - 36px));
        max-height: min(330px, 70vh);
        overflow-y: auto;
      }
      .museum-source-tip .tip-pop {
        width: min(340px, calc(100vw - 36px));

          .map((k) => `<option value="${k}">${metricLabel(k)}</option>`)
          .join("");
        return `${title(t("goals"), t(live ? "goalHint" : "offlineGoalsHint"), live ? `<div class="actions"><a class="badge" href="/api/goals/export">⇩ ${t("export")}</a><button type="button" id="importGoals" class="badge import-button">⇧ ${t("import")}</button><input id="goalsFile" type="file" accept="application/json" class="hidden"></div>` : "")}${colorLegend()}${live ? `<div class="form"><input id="goalTitle" type="text" maxlength="120" aria-label="${t("title")}" placeholder="${t("title")}"><select id="goalMetric" aria-label="${t("metric")}">${metrics}</select><input id="goalTarget" type="number" min="1" step="1" title="${t("goalTargetHint")}" aria-label="${t("total")}" placeholder="${t("total")}" style="width:100px"><button type="button" id="addGoal">+ ${t("addGoal")}</button></div>` : ""}${
          G.goals
            .map((g) => {
              let c = S.counts[g.metric] || [0, 0],
                target = +g.target || c[1];
              return `<div class="card goal"><div class="goal-head"><b>${esc(g.title)}</b><span class="badge ${c[0] >= target ? "ok" : c[0] > 0 ? "warn" : "no"}">${c[0]} / ${target}</span></div><div class="sub">${metricLabel(g.metric)}</div>${meter(c[0], target)}${live ? `<button type="button" data-delgoal="${esc(g.id)}" aria-label="${t("deleteGoal")}" title="${t("deleteGoal")}" style="margin-top:8px">×</button>` : ""}</div>`;
            })
            .join("") || `<div class="empty">${t("noGoals")}</div>`
        }<section class="card" style="margin-top:14px"><h2 class="panel-title">${t("task")} <span class="badge ${G.tasks.length > 0 && G.tasks.every((x) => x.done) ? "ok" : G.tasks.some((x) => x.done) ? "warn" : "no"}">${G.tasks.filter((x) => !x.done).length}/${G.tasks.length}</span></h2>${live ? `<div class="form"><input id="taskTitle" type="text" maxlength="120" aria-label="${t("title")}" placeholder="${t("title")}"><button type="button" id="addTask">+ ${t("addTask")}</button></div>` : ""}${G.tasks.map((a) => `<div class="task ${a.done ? "done" : ""}"><input type="checkbox" data-task="${esc(a.id)}" aria-label="${esc(a.title)}" ${a.done ? "checked" : ""} ${live ? "" : "disabled"}><span style="flex:1;${a.done ? "text-decoration:line-through;color:var(--state-done)" : ""}">${esc(a.title)}</span>${live ? `<button type="button" data-deltask="${esc(a.id)}" aria-label="${t("deleteTask")}" title="${t("deleteTask")}">×</button>` : ""}</div>`).join("") || `<div class="empty">${t("noTasks")}</div>`}</section>`;
      }
      function errorView() {
        let e = ERR || {};
        return `<div class="error"><h2>${esc(e.title || t("noSave"))}</h2><p>${esc(e.detail || "")}</p>${(e.steps || []).map((s) => `<div>• ${esc(s)}</div>`).join("")}<button id="retry" style="margin-top:12px">${t("restore")}</button></div>`;
      }
      const views = {
        overview,
        today,
        perfection,
        museum: () => listPage("museum", t("museum"), S.museum, "museum"),
        fish: () =>
          listPage(
            "fish",
            t("fish"),
            S.fish,
            "fish",
            `<button type="button" id="nowOnly" aria-pressed="${nowOnly}" class="${nowOnly ? "active" : ""}">${t("filterNow")}</button>`,
          ),
        shipped: () => listPage("shipped", t("shipped"), S.shipped),
        cooking: () => listPage("cooking", t("cooking"), S.cooking, "recipe"),
        crafting: () =>
          listPage("crafting", t("crafting"), S.crafting, "recipe"),
        people,
        bundles,
        guild,
        saved: savedPage,
        goals,
      };
      let toastTimer;
      function toast(s) {
        let e = $("#toast");
        e.textContent = s;
        e.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => e.classList.remove("show"), 2400);
      }
      async function persist() {
        S.goals.annotations = S.goals.annotations || {};
        if (MODE === "live") {
          try {
            const response = await fetch("/api/goals", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(S.goals),
            });
            if (!response.ok) throw new Error("Save rejected");
            return true;
          } catch (e) {
            toast(t("saveFailed"));
            return false;
          }
        }
        const saved = LS.set("annotations", S.goals.annotations);
        if (!saved) toast(t("saveFailed"));
        return saved;
      }
      let noteKeyActive = "",
        noteTrigger = null;
      function noteButtonFor(key) {
        return [...document.querySelectorAll("[data-note]")].find(
          (button) => button.dataset.note === key,
        );
      }
      function openNote(key, button) {
        noteKeyActive = key;
        noteTrigger = button;
        let a = annotation(key),
          card = button.closest(".row,.grid-item,.bundle-item"),
          name = card?.querySelector(".name")?.textContent || key;
        $("#noteTitle").textContent = t("notePrompt");
        $("#noteItemName").textContent = name;
        $("#noteText").setAttribute(
          "aria-label",
          `${t("notePrompt")}: ${name}`,
        );
        $("#noteText").value = a.note || "";
        $("#noteModal").classList.remove("hidden");
        document.body.classList.add("modal-open");
        $("#noteText").focus();
      }
      function closeNote(restoreFocus = true) {
        const key = noteKeyActive;
        $("#noteModal").classList.add("hidden");
        document.body.classList.remove("modal-open");
        noteKeyActive = "";
        if (restoreFocus) {
          const target = noteTrigger?.isConnected
            ? noteTrigger
            : noteButtonFor(key);
          target?.focus();
        }
        noteTrigger = null;
      }
      async function saveNote() {
        if (!noteKeyActive) return;
        S.goals = S.goals || { goals: [], tasks: [] };
        S.goals.annotations = S.goals.annotations || {};
        const key = noteKeyActive,
          saveButton = $("#noteSave");
        let a = annotation(key);
        a.note = $("#noteText").value.trim().slice(0, 280);
        if (a.marked || a.note) S.goals.annotations[key] = a;
        else delete S.goals.annotations[key];
        if (saveButton) saveButton.disabled = true;
        const saved = await persist();
        if (saveButton) saveButton.disabled = false;
        if (!saved) return;
        closeNote(false);
        render();
        const target = noteButtonFor(key) || $("#view h1");
        if (target) {
          if (target.tagName === "H1") target.tabIndex = -1;
          target.focus();
        }
        toast(t("savedSuccessfully"));
      }
      function bind() {
        bindControls();
        document.querySelectorAll("details.acq-tip").forEach((tip) => {
          tip.addEventListener("pointerleave", () => {
            tip.open = false;
          });
          tip.addEventListener("focusout", (event) => {
            if (!tip.contains(event.relatedTarget)) tip.open = false;
          });
        });
        [$("#goalTitle"), $("#goalTarget")].forEach((input) => {
          if (input)
            input.onkeydown = (event) => {
              if (event.key === "Enter") {
                event.preventDefault();
                $("#addGoal")?.click();
              }
            };
        });
        const taskTitle = $("#taskTitle");
        if (taskTitle)
          taskTitle.onkeydown = (event) => {
            if (event.key === "Enter") {
              event.preventDefault();
              $("#addTask")?.click();
            }
          };
        document.querySelectorAll("[data-mark]").forEach(
          (b) =>
            (b.onclick = () => {
              S.goals = S.goals || { goals: [], tasks: [] };
              S.goals.annotations = S.goals.annotations || {};
              let key = b.dataset.mark,
                a = annotation(key);
              a.marked = !a.marked;
              if (a.marked || a.note) S.goals.annotations[key] = a;
              else delete S.goals.annotations[key];
              persist();
              render();
              focusDataControl("data-mark", key);
            }),
        );
        document
          .querySelectorAll("[data-note]")
          .forEach((b) => (b.onclick = () => openNote(b.dataset.note, b)));
        let modal = $("#noteModal"),
          saveNoteBtn = $("#noteSave"),
          cancelNoteBtn = $("#noteCancel");
        if (saveNoteBtn) saveNoteBtn.onclick = saveNote;
        if (cancelNoteBtn) cancelNoteBtn.onclick = closeNote;
        if (modal)
          modal.onclick = (e) => {
            if (e.target === modal) closeNote();
          };
        document.onkeydown = (e) => {
          const modal = $("#noteModal");
          if (!modal || modal.classList.contains("hidden")) return;
          if (e.key === "Escape") {
            closeNote();
            return;
          }
          if (e.key === "Tab") {
            const focusable = modal.querySelectorAll(
              'button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])',
            );
            if (!focusable.length) {
              e.preventDefault();
              modal.focus();
              return;
            }
            const first = focusable[0],
              last = focusable[focusable.length - 1];
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
        };
        let n = $("#nowOnly");
        if (n)
          n.onclick = () => {
            nowOnly = !nowOnly;
            render();
            $("#nowOnly")?.focus();
          };
        document.querySelectorAll("[data-kind]").forEach(
          (b) =>
            (b.onclick = () => {
              kindFilter = b.dataset.kind === "all" ? "" : b.dataset.kind;
              render();
              focusDataControl("data-kind", b.dataset.kind);
            }),
        );
        let r = $("#retry");
        if (r)
          r.onclick = () =>
            fetch("/api/refresh")
              .then((response) => {
                if (!response.ok) throw new Error("Refresh failed");
                return pull(true);
              })
              .catch(() => toast(t("apiError")));
        let ag = $("#addGoal");
        if (ag)
          ag.onclick = () => {
            let v = $("#goalTitle").value.trim();
            if (!v) {
              $("#goalTitle").focus();
              return;
            }
            const metric = $("#goalMetric").value,
              targetInput = $("#goalTarget"),
              target = targetInput.value.trim()
                ? Number(targetInput.value)
                : S.counts[metric]?.[1] || 1;
            if (!Number.isInteger(target) || target < 1) {
              targetInput.focus();
              targetInput.reportValidity?.();
              return;
            }
            S.goals.goals.push({
              id: Math.random().toString(36).slice(2),
              title: v,
              metric,
              target,
            });
            persist();
            render();
            $("#goalTitle")?.focus();
          };
        let at = $("#addTask");
        if (at)
          at.onclick = () => {
            let v = $("#taskTitle").value.trim();
            if (!v) {
              $("#taskTitle").focus();
              return;
            }
            S.goals.tasks.push({
              id: Math.random().toString(36).slice(2),
              title: v,
              done: false,
            });
            persist();
            render();
            $("#taskTitle")?.focus();
          };
        document.querySelectorAll("[data-delgoal]").forEach(
          (b) =>
            (b.onclick = () => {
              const id = b.dataset.delgoal;
              S.goals.goals = S.goals.goals.filter((x) => x.id !== id);
              persist();
              render();
              const next = [...document.querySelectorAll("[data-delgoal]")][0];
              (next || $("#goalTitle"))?.focus();
            }),
        );
        document.querySelectorAll("[data-deltask]").forEach(
          (b) =>
            (b.onclick = () => {
              const id = b.dataset.deltask;
              S.goals.tasks = S.goals.tasks.filter((x) => x.id !== id);
              persist();
              render();
              const next = [...document.querySelectorAll("[data-deltask]")][0];
              (next || $("#taskTitle"))?.focus();
            }),
        );
        document.querySelectorAll("[data-task]").forEach(
          (c) =>
            (c.onchange = () => {
              const id = c.dataset.task;
              let x = S.goals.tasks.find((a) => a.id === id);
              if (x) x.done = c.checked;
              persist();
              render();
              focusDataControl("data-task", id);
            }),
        );
        let fi = $("#goalsFile"),
          importButton = $("#importGoals");
        if (importButton && fi) importButton.onclick = () => fi.click();
        if (fi)
          fi.onchange = async () => {
            if (!fi.files?.[0]) return;
            try {
              let d = JSON.parse(await fi.files[0].text());
              if (!Array.isArray(d.goals) || !Array.isArray(d.tasks))
                throw Error("Invalid goals JSON");
              S.goals = d;
              if (!(await persist())) {
                $("#importGoals")?.focus();
                return;
              }
              render();
              $("#importGoals")?.focus();
              toast(t("imported"));
            } catch (e) {
              $("#importGoals")?.focus();
              toast(t("invalidFile"));
            } finally {
              fi.value = "";
            }
          };
      }
      function render() {
        document.documentElement.lang = EN ? "en" : "ru";
        document.title = t("appTitle");
        header();
        nav();
        let v = $("#view");
        if (!S) {
          v.innerHTML = errorView();
          bind();
          return;
        }
        v.innerHTML = (views[route] || overview)();
        bind();
      }
      async function pull(force) {
        if (MODE !== "live") return;
        try {
          let r = await fetch("/api/state", { cache: "no-store" });
          if (!r.ok) {
            let e = await r.json();
            ERR = e.error;
            S = null;
            render();
            return;
          }
          let n = await r.json();
          if (
            force ||
            !S ||
            n.meta.save_mtime !== S.meta.save_mtime ||
            JSON.stringify(n.goals) !== JSON.stringify(S.goals)
          ) {
            S = n;
            ERR = null;
            render();
          }
        } catch (e) {
          if (force) toast(t("apiError"));
        }
      }
      window.addEventListener("hashchange", () => {
        const hashParts = location.hash.slice(1).split("/"),
          requested = hashParts.shift();
        route = sections.includes(requested) ? requested : "overview";
        routeTarget = route === "bundles" ? hashParts.join("/") : "";
        search = "";
        render();
        scrollTo(0, 0);
        if (!focusBundleTarget()) focusViewHeading();
      });
      if (!S && MODE === "live") fetch("/api/refresh").then(pull);
      render();
      focusBundleTarget();
      if (MODE === "live") setInterval(pull, 3000);
    </script>
  </body>
</html>
